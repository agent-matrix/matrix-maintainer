[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-maintainer"
version = "0.2.0"
description = "Cross-repository orchestration controller for the Agent-Matrix ecosystem. Engine codename: Matrix Codex."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "Apache-2.0"}
authors = [{name = "Agent-Matrix"}]
dependencies = [
  "PyGithub>=2.3.0",
  "GitPython>=3.1.43",
  "Jinja2>=3.1.4",
  "PyYAML>=6.0.2",
  "httpx>=0.27.0",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "typer>=0.12.3",
  "rich>=13.7.1",
  "tenacity>=8.5.0",
  "packaging>=24.1",
  "fastapi>=0.116.0",
  "jsonschema>=4.22.0",
  "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-cov>=5.0.0",
  "respx>=0.21.0",
]
selfrepair = [
  "selfrepair-repo",
]
mcp = [
  "huggingface_hub>=0.24.0",
  "boto3>=1.34.0",
]

[project.scripts]
# Engine codename (kept stable for backward compatibility).
matrix-codex = "matrix_codex.cli:app"
# User-facing brand: prefer this in new docs/automation.
matrix-maintainer = "matrix_codex.cli:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["matrix_codex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[dependency-groups]
dev = [
  "pytest>=8.3.2",
  "pytest-cov>=5.0.0",
  "respx>=0.21.0",
]
